<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative paths into `src/assets` so the bundler owns these files and can
         inline them in the single-file build (see `scripts/build-single-file.mjs`). -->
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Lotus Dashboard Creator — build, arrange and persist your own personal dashboard with draggable, resizable widgets."
    />
    <title>Lotus Dashboard Creator</title>
    <script>
      // Apply the persisted colour scheme before first paint to avoid a flash of
      // the wrong theme. Kept tiny and dependency-free on purpose — it cannot
      // import the theme engine, so it replays the cached palette tokens the store
      // writes next to the choice (`src/store/prefsStore.ts`). Keep the token
      // prefixes and the attribute name in step with `src/lib/theme.ts`; a unit
      // test pins the two together.
      //
      // The key is scoped by path when the page is opened from disk, because
      // every `file://` document shares a single origin. Keep this in step with
      // `src/lib/storageKeys.ts`.
      (function () {
        try {
          var scope = location.protocol === 'file:' ? ':' + location.pathname : '';
          var raw = localStorage.getItem('lotus-dashboard-creator:prefs/v1' + scope);
          var state = raw ? JSON.parse(raw).state : null;
          var mode = (state && state.theme) || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.dataset.theme = (state && state.themeId) || 'lotus';

          var tokens = (state && state.themeTokens) || null;
          for (var key in tokens) {
            // Only the keys this app writes, and only ever a colour value.
            if (!/^--color-slate-\d{2,3}$|^--color-violet-\d{2,3}$|^--color-accent-fg$/.test(key)) continue;
            var value = tokens[key];
            if (typeof value !== 'string' || value.length > 40) continue;
            if (!/^[#oklchrgb(),.%\d\s\/-]+$/.test(value)) continue;
            root.style.setProperty(key, value);
          }
        } catch (e) {
          /* storage unavailable — fall back to the default theme */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 34rem; margin: 12vh auto; padding: 0 1.5rem; text-align: center; color: #334155">
        <h1 style="font-size: 1.1rem">This dashboard needs JavaScript</h1>
        <p style="line-height: 1.6; font-size: 0.9rem">
          JavaScript is switched off in this browser, and the whole dashboard runs on it. Turn JavaScript on and
          reload this page, or open the file in Chrome, Edge, Firefox or Safari. There is nothing to install, and
          nothing you type is sent anywhere.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
